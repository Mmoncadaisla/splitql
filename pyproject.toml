[project]
name = "splitql"
version = "0.1.0"
description = "Split a SQL query into per-partition fragments plus a reduce query. Pure planning, no runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Miguel Moncada" }]
keywords = ["sql", "duckdb", "sqlglot", "parquet", "ducklake", "partitioning", "map-reduce", "query-planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["sqlglot>=30"]

[project.urls]
Homepage = "https://github.com/Mmoncadaisla/splitql"
Documentation = "https://mmoncadaisla.github.io/splitql/"
Repository = "https://github.com/Mmoncadaisla/splitql"
Issues = "https://github.com/Mmoncadaisla/splitql/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "duckdb>=1.0", "pyarrow>=17"]
examples = ["jupyterlab", "pandas", "duckdb>=1.0", "pyarrow>=17"]
docs = ["zensical==0.0.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
